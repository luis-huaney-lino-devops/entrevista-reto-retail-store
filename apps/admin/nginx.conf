# nginx del panel: sirve el bundle de Vite. No enruta nada hacia la API — de
# eso se encarga el nginx de entrada (deploy/nginx/), y el navegador habla con
# la API por su dominio propio (VITE_API_URL).

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Las respuestas de nginx son publicas; que no se cuele la version.
    server_tokens off;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    # Vite pone el hash del contenido en el nombre de cada asset: si el archivo
    # cambia, cambia la URL. Por eso se puede cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # El index es lo unico que NO se cachea: es el que apunta a los assets
    # nuevos. Cachearlo deja al navegador pidiendo un bundle que ya no existe.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # El enrutado es de react-router y vive en el cliente: cualquier ruta que
    # no sea un archivo tiene que devolver el index, o recargar /productos da
    # un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
