# Desarrollo local.
#   Solo BD:        docker compose -f deploy/docker-compose.dev.yml up -d db
#   BD + API Java:  docker compose -f deploy/docker-compose.dev.yml --profile java up -d --build
name: retail-store-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retailstore_java
    ports:
      # 5433 en el anfitrión a propósito: es habitual tener un PostgreSQL
      # instalado en la máquina ocupando el 5432, y entonces la aplicación se
      # conecta a ese sin avisar y falla la autenticación. Dentro de la red de
      # Docker el puerto sigue siendo el 5432.
      - "${DB_PUERTO_HOST:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retailstore_java"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-java:
    profiles: ["java"]
    build:
      context: ..
      dockerfile: backend/java/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/retailstore_java
      DB_USER: retail
      DB_PASSWORD: retail
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
