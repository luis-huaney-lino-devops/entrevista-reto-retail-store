# Cabeceras comunes a todo lo que se reenvia. Se incluye dentro de cada
# `location` con `include /etc/nginx/proxy.conf;`.

proxy_http_version 1.1;

# El Host original: es lo que mira nginx para elegir el server, y lo que la API
# necesita para construir URLs absolutas correctas.
proxy_set_header Host $host;

proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header X-Forwarded-For $cadena_reenviada;

# Estas dos NO se ponen a $scheme / $server_port: delante hay un Traefik que ya
# termino el TLS y nos habla en claro. Si las sobrescribimos, Spring
# (`forward-headers-strategy: framework`) cree que la peticion llego por http,
# y a partir de ahi genera redirecciones a http:// y marca mal las cookies. Los
# `map` de gateway.conf conservan lo que venga y solo rellenan si falta.
proxy_set_header X-Forwarded-Proto $proto_reenviado;
proxy_set_header X-Forwarded-Port  $puerto_reenviado;
proxy_set_header X-Forwarded-Host  $host;

# Los tiempos de espera NO van aqui: se fijan una vez a nivel http en
# gateway.conf. `proxy_read_timeout` admite un solo valor por contexto, y este
# archivo se incluye dentro de un `location` que a veces necesita el suyo
# propio (el del WebSocket) — dos veces en el mismo bloque es un error de
# arranque, no una sobrescritura.
