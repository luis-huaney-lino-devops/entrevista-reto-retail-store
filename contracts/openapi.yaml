# ============================================================================
# GENERADO. No se edita a mano.
#
# Sale de la propia aplicación, con springdoc, a partir de los controladores y
# sus anotaciones de validación. Para regenerarlo:
#
#     cd backend/java && mvn spring-boot:run
#     curl -s http://localhost:8080/v3/api-docs.yaml -o ../../contracts/openapi.yaml
#
# Por qué generado y no escrito a mano: la versión anterior se escribió antes
# que el código y quedó desfasada en tres cosas a la vez (idioma, categorías de
# un nivel, endpoints inexistentes). Un contrato que miente es peor que no
# tenerlo, porque quien lo lee le cree.
#
# El diseño -qué endpoints existen y por qué- vive en docs/, que es donde se
# discute. Esto es el reflejo de lo que hay.
# ============================================================================
openapi: 3.1.0
info:
  title: Retail Store API
  description: |-
    API REST del e-commerce Retail Store.

    Los errores siguen RFC 9457 (application/problem+json) con las extensiones code y correlationId. El cliente se ramifica por code, nunca por detail.
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/cuenta/yo:
    get:
      tags:
      - Cuenta (tienda)
      summary: El perfil de quien trae el token
      operationId: yo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuentaRespuesta"
      security:
      - tokenTienda: []
    put:
      tags:
      - Cuenta (tienda)
      summary: "Cambiar nombre y teléfono. El correo no se edita: es la identidad\
        \ (RN-060)"
      operationId: actualizarPerfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarPerfilPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuentaRespuesta"
      security:
      - tokenTienda: []
  /api/v1/cuenta/favoritos/{productoId}:
    put:
      tags:
      - Favoritos (tienda)
      summary: Marcar un producto como favorito. Idempotente
      operationId: agregar
      parameters:
      - name: productoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenTienda: []
    delete:
      tags:
      - Favoritos (tienda)
      summary: Quitarlo de favoritos. Idempotente
      operationId: quitar
      parameters:
      - name: productoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenTienda: []
  /api/v1/cuenta/direcciones/{id}:
    put:
      tags:
      - Direcciones (tienda)
      summary: Editar una dirección
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DireccionPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DireccionRespuesta"
      security:
      - tokenTienda: []
    delete:
      tags:
      - Direcciones (tienda)
      summary: "Eliminar una dirección. Es lógica (RN-086): las órdenes antiguas siguen\
        \ explicándose"
      operationId: eliminar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenTienda: []
  /api/v1/admin/subcategorias/{id}:
    get:
      tags:
      - Subcategorías (panel)
      summary: Detalle de una subcategoría
      operationId: porId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubcategoriaRespuesta"
      security:
      - tokenPanel: []
    put:
      tags:
      - Subcategorías (panel)
      summary: Actualizar una subcategoría; admite moverla de categoría
      operationId: actualizar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarSubcategoriaPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubcategoriaRespuesta"
      security:
      - tokenPanel: []
    delete:
      tags:
      - Subcategorías (panel)
      summary: "Eliminación lógica: la fila se conserva con quién y cuándo"
      operationId: eliminar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenPanel: []
  /api/v1/admin/productos/{id}:
    get:
      tags:
      - Productos (panel)
      summary: Detalle de un producto por id
      operationId: porId_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductoAdminRespuesta"
      security:
      - tokenPanel: []
    put:
      tags:
      - Productos (panel)
      summary: Actualizar un producto. El SKU no se puede cambiar
      operationId: actualizar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarProductoPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductoAdminRespuesta"
      security:
      - tokenPanel: []
    delete:
      tags:
      - Productos (panel)
      summary: "Eliminación lógica: sale del catálogo y del panel, pero la fila se\
        \ conserva"
      operationId: eliminar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenPanel: []
  /api/v1/admin/marcas/{id}:
    get:
      tags:
      - Marcas (panel)
      summary: Detalle de una marca
      operationId: porId_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MarcaRespuesta"
      security:
      - tokenPanel: []
    put:
      tags:
      - Marcas (panel)
      summary: Actualizar una marca
      operationId: actualizar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarMarcaPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MarcaRespuesta"
      security:
      - tokenPanel: []
    delete:
      tags:
      - Marcas (panel)
      summary: "Eliminación lógica: la fila se conserva con quién y cuándo"
      operationId: eliminar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenPanel: []
  /api/v1/admin/cupones/{id}:
    get:
      tags:
      - Cupones (panel)
      summary: Detalle de un cupón
      operationId: porId_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuponRespuesta"
      security:
      - tokenPanel: []
    put:
      tags:
      - Cupones (panel)
      summary: Actualizar un cupón. El código no cambia
      operationId: actualizar_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuponPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuponRespuesta"
      security:
      - tokenPanel: []
    delete:
      tags:
      - Cupones (panel)
      summary: "Eliminación lógica. El código no se libera: aparece en órdenes pasadas"
      operationId: eliminar_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenPanel: []
  /api/v1/admin/categorias/{id}:
    get:
      tags:
      - Categorías (panel)
      summary: "Detalle de una categoría, con sus subcategorías"
      operationId: porId_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoriaRespuesta"
      security:
      - tokenPanel: []
    put:
      tags:
      - Categorías (panel)
      summary: Actualizar una categoría
      operationId: actualizar_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarCategoriaPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoriaRespuesta"
      security:
      - tokenPanel: []
    delete:
      tags:
      - Categorías (panel)
      summary: "Eliminación lógica: la fila se conserva con quién y cuándo"
      operationId: eliminar_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - tokenPanel: []
  /api/v1/admin/administradores/{id}:
    put:
      tags:
      - Administradores
      summary: "Actualizar nombre, rol y estado"
      operationId: actualizar_6
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarAdministradorPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdministradorRespuesta"
      security:
      - tokenPanel: []
  /api/v1/cuenta/yo/contrasena:
    post:
      tags:
      - Cuenta (tienda)
      summary: Cambiar o establecer la contraseña. La actual solo se pide si ya había
        una (RN-065)
      operationId: cambiarContrasena
      parameters:
      - name: refresco_tienda
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarContrasenaClientePeticion"
        required: true
      responses:
        "200":
          description: OK
      security:
      - tokenTienda: []
  /api/v1/cuenta/salir:
    post:
      tags:
      - Cuenta (tienda)
      summary: Cerrar la sesión y revocar el refresco
      operationId: salir
      parameters:
      - name: refresco_tienda
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
      security:
      - tokenTienda: []
  /api/v1/cuenta/registro:
    post:
      tags:
      - Cuenta (tienda)
      summary: Crear una cuenta. Responde 202 exista o no el correo (RN-061)
      operationId: registro
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
      - tokenTienda: []
  /api/v1/cuenta/refrescar:
    post:
      tags:
      - Cuenta (tienda)
      summary: Renovar el token de acceso con la cookie de refresco
      operationId: refrescar
      parameters:
      - name: refresco_tienda
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SesionClienteRespuesta"
      security:
      - tokenTienda: []
  /api/v1/cuenta/google:
    post:
      tags:
      - Cuenta (tienda)
      summary: Entrar con el ID token de Google. Vincula si el correo ya tiene cuenta
      operationId: accesoConGoogle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccesoGooglePeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SesionClienteRespuesta"
      security:
      - tokenTienda: []
  /api/v1/cuenta/direcciones:
    get:
      tags:
      - Direcciones (tienda)
      summary: "Las direcciones del cliente, la predeterminada primero"
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DireccionRespuesta"
      security:
      - tokenTienda: []
    post:
      tags:
      - Direcciones (tienda)
      summary: Añadir una dirección. La primera queda predeterminada siempre
      operationId: crear
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DireccionPeticion"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DireccionRespuesta"
      security:
      - tokenTienda: []
  /api/v1/cuenta/direcciones/{id}/predeterminada:
    post:
      tags:
      - Direcciones (tienda)
      summary: Marcarla como predeterminada. Desmarca la anterior
      operationId: predeterminada
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DireccionRespuesta"
      security:
      - tokenTienda: []
  /api/v1/cuenta/acceso:
    post:
      tags:
      - Cuenta (tienda)
      summary: Entrar con correo y contraseña
      operationId: acceso
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccesoClientePeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SesionClienteRespuesta"
      security:
      - tokenTienda: []
  /api/v1/conversaciones/{token}/mensajes:
    post:
      tags:
      - Chat (tienda)
      summary: Escribir como cliente
      operationId: escribir
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnviarMensajePeticion"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MensajeRespuesta"
  /api/v1/conversaciones/{token}/adjuntos:
    post:
      tags:
      - Chat (tienda)
      summary: "Adjuntar imagen o PDF. Se valida el contenido, no la extensión"
      operationId: subirAdjunto
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
              required:
              - archivo
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/carritos:
    post:
      tags:
      - Carrito
      summary: Crear un carrito vacío
      operationId: crear_1
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CarritoRespuesta"
  /api/v1/carritos/{id}/items:
    post:
      tags:
      - Carrito
      summary: Agregar un producto o sumar a la línea existente
      operationId: agregarItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgregarItemPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CarritoRespuesta"
  /api/v1/carritos/{id}/cupon:
    post:
      tags:
      - Carrito
      summary: Aplicar un cupón. Un carrito admite como mucho uno
      operationId: aplicarCupon
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AplicarCuponPeticion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CarritoRespuesta"
    delete:
      tags:
      - Carrito
      summary: Quitar el cupón
      operationId: quitarCupon
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CarritoRespuesta"
  /api/v1/admin/subcategorias:
    get:
      tags:
      - Subcategorías (panel)
      summary: Listado de subcategorías de toda la tienda
      operationId: listar_1
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: tamanoPagina
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaPaginaSubcategoriaRespuesta"
      security:
      - tokenPanel: []
    post:
      tags:
      - Subcategorías (panel)
      summary: Crear una subcategoría dentro de una categoría
      operationId: crear_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearSubcategoriaPeticion"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubcategoriaRespuesta"
      security:
      - tokenPanel: []
  /api/v1/admin/salir:
    post:
      tags:
      - Acceso al panel
      summary: Cerrar la sesión y revocar el refresco
      operationId: salir_1
      parameters:
      - name: refresco_panel
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/admin/refrescar:
    post:
      tags:
      - Acceso al panel
      summary: Renovar el token de acceso con la cookie de refresco
      operationId: refrescar_1
      parameters:
      - name: refresco_panel
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SesionRespuesta"
  /api/v1/admin/productos:
    get:
      tags:
      - Productos (panel)
      summary: Listado con búsqueda por nombre o SKU y filtro por estado
      operationId: listar_2
      parameters:
      - name: texto
        in: query
        required: false
        schema:
          type: string
      - name: categoria
        in: query
        required: false
        schema:
          type: string
      - name: subcategoria
        in: query
        required: false
        schema:
          type: string
      - name: marca
        in: query
        required: false
        schema:
          type: string
      - name: precioMinimo
        in: query
        required: false
        schema:
          type: number
      - name: precioMaximo
        in: query
        required: false
        schema:
          type: number
      - name: conStock
        in: query
        required: false
        schema:
          type: boolean
      - name: destacado
        in: query
        required: false
        schema:
          type: boolean
      - name: orden
        in: query
        required: false
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: tamanoPagina
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 48
          minimum: 1
      - name: activo
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaPaginaProductoAdminRespuesta"
      security:
      - tokenPanel: []
    post:
      tags:
      - Productos (panel)
      summary: "Crear un producto. Nace inactivo: publicar es un PATCH aparte"
      operationId: crear_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearProductoPeticion"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductoAdminRespuesta"
      security:
      - tokenPanel: []
  /api/v1/admin/papelera/restaurar:
    post:
